<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="images/github.png" alt="Github-Avatar">
            <h1 class="profile-name">User's name</h1>
            <h2 class="profile-username">Username</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositories</h4>
                    <p id="repos">-</p>
                </li>
                <li class="numbers-item">
                    <h4>Followers</h4>
                    <p id="followers">-</p>
                </li>
                <li class="numbers-item">
                    <h4>Following</h4>
                    <p id="following">-</p>
                </li>
            </ul>
            <a href="#" class="profile-link">View on Github</a>
            <div class="div__form">
                <form class="form" id="form">
                    <label for="input-user">
                        Type the username
                    </label>
                    <div class="search-container">
                        <input type="text" name="username" id="input-user" placeholder="Username here...">
                        <button type="submit" id="btn-search">
                            <i class="bi bi-search"></i>
                            <span class="d-none spinner-border spinner-border-sm"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </header>

    <footer>Desenvolvido por <a href="https://github.com/erickmjr" target="_blank">erickmjr</a></footer>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
